[workspace]
resolver = "2"
members = ["player-core", "player-video", "player-ui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.2"
mpv-engine = "0.2.1"
serde_json = "1"
gtk = { package = "gtk4", version = "0.11.5", features = ["gnome_50"] }
libadwaita = { version = "0.9.2", features = ["v1_10", "gtk_v4_24"] }
