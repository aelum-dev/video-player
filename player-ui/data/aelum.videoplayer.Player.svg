<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="512" height="512" viewBox="0 0 512 512">
  <!-- Screen-and-play app icon, one of a two-icon set shared with the package
       manager (same grid, same palette). 512 pt artboard, the monitor scaled
       up to fill it: centred on x = 256, top y = 66, baseline y = 446, no
       ground shadow.
       Shell #c6a3d2 → #9e6ca6, screen #7b4c86 → #45294f, glyph #ddcbe4 →
       #c6b0ce, stand #472b51. Gradients only — no filters, no bitmap.
       Fills are the export's CSS classes; width/height are added so the file
       carries an intrinsic size like every other hicolor icon. -->
  <defs>
    <style>
      .cls-1{fill:#472b51}
      .cls-2{fill:url(#linear-gradient-1)}
      .cls-3{fill:url(#linear-gradient-2)}
      .cls-4{fill:url(#linear-gradient-3)}
    </style>
    <linearGradient id="linear-gradient-1" x1="256" y1="65.951" x2="256" y2="394.351" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c6a3d2"/>
      <stop offset="0.5" stop-color="#b288bc"/>
      <stop offset="1" stop-color="#9e6ca6"/>
    </linearGradient>
    <linearGradient id="linear-gradient-2" x1="256" y1="86.513" x2="256" y2="373.789" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7b4c86"/>
      <stop offset="0.5" stop-color="#603a6a"/>
      <stop offset="1" stop-color="#45294f"/>
    </linearGradient>
    <linearGradient id="linear-gradient-3" x1="256" y1="161.358" x2="256" y2="294.48" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ddcbe4"/>
      <stop offset="0.5" stop-color="#d2bed9"/>
      <stop offset="1" stop-color="#c6b0ce"/>
    </linearGradient>
  </defs>
  <title>media-player</title>
